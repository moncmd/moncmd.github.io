<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMD.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  body{font-family:'Montserrat',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;color:#666;text-align:center;padding:24px;}
</style>
</head>
<body>
<p id="message-chargement">Chargement de la boutique…</p>

<script>
(async function () {
  const messageEl = document.getElementById('message-chargement');

  // Le premier segment du chemin est censé être le slug du client
  // (ex : shop.moncmd.site/victoryfood -> "victoryfood")
  const chemin = window.location.pathname.replace(/^\/|\/$/g, '');
  const slug = chemin.split('/')[0];

  if (!slug) {
    messageEl.textContent = "Page introuvable.";
    return;
  }

  const { data: vendeur, error } = await supabaseClient
    .from('vendeurs')
    .select('template, actif, type_activite')
    .eq('slug', slug)
    .single();

  if (error || !vendeur || !vendeur.actif) {
    messageEl.textContent = "Cette boutique n'existe pas ou plus.";
    return;
  }

  const template = vendeur.template ? vendeur.template.toLowerCase() : '';

  // Les vendeurs "prestation" ont des fichiers nommés différemment
  // (index-prestations-minimal.html, pas index-minimal.html), et ont
  // toujours besoin d'un template précis (pas de version "par défaut").
  let fichier;
  if (vendeur.type_activite === 'prestation') {
    if (!template) {
      messageEl.textContent = "Aucune template définie pour cette boutique.";
      return;
    }
    fichier = `index-prestations-${template}`;
  } else {
    fichier = template ? `index-${template}` : 'index';
  }

  // Vraie navigation vers le fichier réel (chargement normal, fiable, sans
  // document.write). Le paramètre "pretty=1" indique à script.js de
  // remettre l'URL "chemin propre" dans la barre d'adresse une fois arrivé,
  // via history.replaceState (voir script.js).
  window.location.replace(`/${fichier}.html?v=${encodeURIComponent(slug)}&pretty=1`);
})();
</script>
</body>
</html>
